[project]
name = "rootsmarkt-processing"
version = "1.0.0"
description = "Sealed data-processing layer for the Rootsmarkt orchestration course"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootsmarkt_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
